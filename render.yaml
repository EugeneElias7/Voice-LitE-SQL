services:
  - type: web
    name: voice-lite-sql-backend
    env: python
    plan: free
    buildCommand: grep -vE "^(pyaudio|sounddevice|soundcard|pycaw)" requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt && python -m backend.database.seed
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HOST
        value: 0.0.0.0

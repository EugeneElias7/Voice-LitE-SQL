services:
  - type: web
    name: voice-lite-sql-api
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
    startCommand: python start_server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: DATABASE_PATH
        value: /opt/render/project/src/backend/data/enterprise.db
      - key: INDEX_DIR
        value: /opt/render/project/src/evaluation/index
      - key: SEED_DB_ON_STARTUP
        value: "true"